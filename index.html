    function formatTimecode(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, "0");
      const s = (seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    function recalculateSceneTimings(scenes, sceneDuration) {
      return scenes.map((sc, idx) => ({
        ...sc,
        start: idx * sceneDuration,
        end: (idx + 1) * sceneDuration
      }));
    }

    function App() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.scenes) && Array.isArray(parsed.characters)) return parsed;
          }
        } catch (err) {
          console.warn("Failed to load state from localStorage:", err);
        }
        return createInitialState();
      });

      // Multi-expand support + Quick Story View mode so users can always edit story directly
      const [expandedSceneIds, setExpandedSceneIds] = useState(() => state.scenes.map((s) => s.id));
      const [quickStoryMode, setQuickStoryMode] = useState(false);
      const [copiedGlobal, setCopiedGlobal] = useState(false);
      const [copiedSceneId, setCopiedSceneId] = useState(null);
      const [copiedCharId, setCopiedCharId] = useState(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn("Auto-save failed:", err);
        }
      }, [state]);

      const updateField = (key, value) => setState((prev) => ({ ...prev, [key]: value }));
      const updateVisual = (key, value) => setState((prev) => ({ ...prev, visualLock: { ...prev.visualLock, [key]: value } }));
      const updateAudio = (key, value) => setState((prev) => ({ ...prev, audioLock: { ...prev.audioLock, [key]: value } }));

      // Handle Total Duration Slider change explicitly
      const handleDurationSliderChange = (newTotalSec) => {
        const targetCount = Math.max(1, Math.min(40, Math.round(newTotalSec / state.sceneDuration)));
        setState((prev) => {
          let nextScenes = [...prev.scenes];
          if (nextScenes.length < targetCount) {
            for (let i = nextScenes.length; i < targetCount; i++) {
              const def = DEFAULT_SCENE_PROMPTS[i] || {};
              const newId = `scene-${i}-${Date.now()}`;
              nextScenes.push({
                id: newId,
                title: i < SCENE_BEATS.length ? SCENE_BEATS[i] : `SHOT ${String(i + 1).padStart(2, "0")} - ดำเนินเรื่องต่อเนื่อง`,
                start: i * prev.sceneDuration,
                end: (i + 1) * prev.sceneDuration,
                prompt: def.prompt || "ดำเนินเรื่องต่อเนื่องในบรรยากาศเดิม รักษาความต่อเนื่องของตัวละครและแสง",
                shotSize: def.shotSize || "Medium Shot (MS)",
                movement: def.movement || "Slow Dolly Push-In",
                lens: def.lens || "35mm Prime Cinema f/2.0",
                lighting: def.lighting || "Low-Key Chiaroscuro (High Contrast 8:1)",
                voiceover: def.vo || "",
                sfx: def.sfx || "",
                activeCharIds: prev.characters.length > 0 ? [prev.characters[0].id] : []
              });
            }
          } else if (nextScenes.length > targetCount) {
            nextScenes = nextScenes.slice(0, targetCount);
          }
          nextScenes = recalculateSceneTimings(nextScenes, prev.sceneDuration);
          return {
            ...prev,
            totalDuration: nextScenes.length * prev.sceneDuration,
            scenes: nextScenes
          };
        });
      };

      const handleSceneDurationChange = (newShotSec) => {
        setState((prev) => {
          const updatedScenes = recalculateSceneTimings(prev.scenes, newShotSec);
          return {
            ...prev,
            sceneDuration: newShotSec,
            totalDuration: updatedScenes.length * newShotSec,
            scenes: updatedScenes
          };
        });
      };

      const handleSelectMasterStyle = (newStyle) => {
        setState((prev) => {
          const preset = STYLE_DNA_PRESETS[newStyle];
          if (preset) {
            return {
              ...prev,
              masterStyle: newStyle,
              visualLock: {
                ...prev.visualLock,
                style: preset.style,
                atmosphere: preset.atmosphere,
                colorPalette: preset.colorPalette

          return { ...prev, masterStyle: newStyle };

      const handleAutoAdaptStoryToShots = () => {
        const char1Name = state.characters[0] ? state.characters[0].name.split(" - ")[0] : "ตัวละครหลัก";
        const char2Name = state.characters[1] ? state.characters[1].name.split(" - ")[0] : "คู่กรณี/ตัวละครที่สอง";
        const topicShort = state.topic.trim() || "เรื่องราวที่กำหนด";

        const beatTemplates = [
          {
            beat: "HOOK - ตะขอเกี่ยวจิต",
            prompt: `ภาพโคลสอัพใบหน้าและแววตาของ ${char1Name} ท่ามกลางบรรยากาศที่ตึงเครียดของเรื่อง (${topicShort.slice(0, 70)}...) แสงเงาตัดกันจัดจ้าน`,
            vo: `นี่คือจุดเริ่มต้นของเรื่องราวที่ไม่มีใครคาดคิด... เกี่ยวกับ ${char1Name}`
          },
          {
            beat: "INTRO - เปิดโลกเรื่องเล่า",
            prompt: `ภาพมุมกว้างเผยให้เห็นสถานที่หลักของเรื่อง (${state.visualLock.atmosphere}) โดยมี ${char1Name} ปรากฏตัวอยู่ในฉาก`,
            vo: topicShort
          },
          {
            beat: "ORIGIN / BACKSTORY - จุดกำเนิดของเรื่องราว",
            prompt: `ภาพเล่าเรื่องราวปมหลังและที่มาของเหตุการณ์ ระหว่าง ${char1Name} และ ${char2Name} ท่ามกลางบรรยากาศที่กดดัน`,
            vo: `ทุกอย่างเริ่มต้นขึ้นจากปมในอดีตที่เชื่อมโยงทุกคนเข้าด้วยกัน`
          },
          {
            beat: "CHARACTER REVEAL - เผยโฉมและการตัดสินใจ",
            prompt: `${char1Name} ยืนเด่นกลางเฟรม แสดงสีหน้ามุ่งมั่น เตรียมพร้อมเผชิญหน้ากับสถานการณ์ตรงหน้า แสงตกกระทบใบหน้าชัดเจน`,
            vo: `${char1Name} ตัดสินใจก้าวเข้าสู่ศูนย์กลางของเรื่องราวนี้ด้วยตัวเอง`
          },
          {
            beat: "INCITING INCIDENT - เหตุการณ์จุดชนวน",
            prompt: `เกิดเหตุการณ์ไม่คาดฝันขึ้นตรงหน้า ${char1Name} ท่ามกลางบรรยากาศที่เปลี่ยนไปอย่างรวดเร็ว กล้องเคลื่อนเข้าหาตัวละคร`,
            vo: `แต่แล้ว เหตุการณ์ที่เป็นจุดเปลี่ยนสำคัญก็เริ่มต้นขึ้นโดยไม่มีสัญญาณเตือน`
          },
          {
            beat: "RISING TENSION - ความตึงเครียดก่อตัว",
            prompt: `${char1Name} เดินหน้าค้นหาความจริง ท่ามกลางอุปสรรคและบรรยากาศที่บีบคั้นมากขึ้นเรื่อยๆ`,
            vo: `ยิ่งก้าวเข้าไปลึกเท่าไหร่ แรงกดดันรอบตัวก็ยิ่งทวีความรุนแรงขึ้น`
          },
          {
            beat: "CONFLICT - การปะทะและความขัดแย้ง",
            prompt: `${char1Name} เผชิญหน้ากับความขัดแย้งครั้งสำคัญกับ ${char2Name} สีหน้าและท่าทางเต็มไปด้วยอารมณ์ที่ปะทุขึ้น`,
            vo: `เมื่อความจริงปะทะกับความต้องการ ทางเลือกจึงเหลือเพียงการเผชิญหน้า`
          },
          {
            beat: "CLIMAX / RESOLUTION - จุดไคลแมกซ์และบทสรุป",
            prompt: `ฉากไคลแมกซ์ทรงพลัง ${char1Name} และ ${char2Name} ในวินาทีตัดสินชะตา แสงและองค์ประกอบภาพยิ่งใหญ่ระดับภาพยนตร์`,
            vo: `และนี่คือบทสรุปของเรื่องราวทั้งหมดที่ทิ้งร่องรอยไว้ตลอดกาล`
          }
        ];

        setState((prev) => {
          const updatedScenes = prev.scenes.map((sc, idx) => {
            const tpl = beatTemplates[idx % beatTemplates.length];
            const isLast = idx === prev.scenes.length - 1 && prev.scenes.length > 3;
            const chosen = isLast ? beatTemplates[beatTemplates.length - 1] : tpl;
            return {
              ...sc,
              title: `${String(idx + 1).padStart(2, "0")} - ${chosen.beat}`,
              prompt: chosen.prompt,
              voiceover: chosen.vo,
              activeCharIds: prev.characters.map((c) => c.id)
            };
          });
          return { ...prev, scenes: updatedScenes };
        });

        // Expand all scenes so the user sees the updated story immediately
        setExpandedSceneIds(state.scenes.map((s) => s.id));
      };

      // ============================================================================
      // 5. SCENE CRUD (EDIT, ADD, DUPLICATE, MOVE, DELETE, EXPAND/COLLAPSE)
      // ============================================================================
      const toggleExpandScene = (id) => {
        setExpandedSceneIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const expandAllScenes = () => setExpandedSceneIds(state.scenes.map((s) => s.id));
      const collapseAllScenes = () => setExpandedSceneIds([]);

      const updateScene = (id, key, value) => {
        setState((prev) => ({
          ...prev,
          scenes: prev.scenes.map((sc) => (sc.id === id ? { ...sc, [key]: value } : sc))
        }));
      };

      const addNewScene = () => {
        const newId = `scene-custom-${Date.now()}`;
        setState((prev) => {
          const nextIdx = prev.scenes.length;
          const newScene = {
            id: newId,
            title: `SHOT ${String(nextIdx + 1).padStart(2, "0")} - ฉากใหม่ (แก้ไขชื่อและเนื้อเรื่องได้)`,
            start: nextIdx * prev.sceneDuration,
            end: (nextIdx + 1) * prev.sceneDuration,
            prompt: "ระบุรายละเอียดเนื้อเรื่อง การกระทำของตัวละคร และอารมณ์ในช็อตนี้...",
            shotSize: "Medium Shot (MS)",
            movement: "Slow Dolly Push-In",
            lens: "35mm Prime Cinema f/2.0",
            lighting: "Low-Key Chiaroscuro (High Contrast 8:1)",
            voiceover: "ระบุบทพูดหรือเสียงบรรยายของช็อตนี้...",
            sfx: "",
            activeCharIds: prev.characters.length > 0 ? [prev.characters[0].id] : []
          };
          const nextScenes = recalculateSceneTimings([...prev.scenes, newScene], prev.sceneDuration);
          return {
            ...prev,
            totalDuration: nextScenes.length * prev.sceneDuration,
            scenes: nextScenes
          };
        });
        setExpandedSceneIds((prev) => [...prev, newId]);
      };

      const duplicateScene = (e, idx) => {
        e.stopPropagation();
        const source = state.scenes[idx];
        const newId = `scene-dup-${Date.now()}`;
        setState((prev) => {
          const copy = {
            ...source,
            id: newId,
            title: `${source.title} (Copy)`
          };
          const nextScenes = [...prev.scenes];
          nextScenes.splice(idx + 1, 0, copy);
          const timed = recalculateSceneTimings(nextScenes, prev.sceneDuration);
          return {
            ...prev,
            totalDuration: timed.length * prev.sceneDuration,
            scenes: timed
          };
        });
        setExpandedSceneIds((prev) => [...prev, newId]);
      };

      const deleteScene = (e, id) => {
        e.stopPropagation();
        if (state.scenes.length <= 1) return;
        setState((prev) => {
          const filtered = prev.scenes.filter((sc) => sc.id !== id);
          const timed = recalculateSceneTimings(filtered, prev.sceneDuration);
          return {
            ...prev,
            totalDuration: timed.length * prev.sceneDuration,
            scenes: timed
          };
        });
      };

      const moveScene = (e, idx, direction) => {
        e.stopPropagation();
        const targetIdx = idx + direction;
        if (targetIdx < 0 || targetIdx >= state.scenes.length) return;
        setState((prev) => {
          const nextScenes = [...prev.scenes];
          const temp = nextScenes[idx];
          nextScenes[idx] = nextScenes[targetIdx];
          nextScenes[targetIdx] = temp;
          const timed = recalculateSceneTimings(nextScenes, prev.sceneDuration);
          return { ...prev, scenes: timed };
        });
      };

      const toggleSceneCharacter = (sceneId, charId) => {
        setState((prev) => ({
          ...prev,
          scenes: prev.scenes.map((sc) => {
            if (sc.id !== sceneId) return sc;
            const current = sc.activeCharIds || [];
            const exists = current.includes(charId);
            const nextIds = exists ? current.filter((id) => id !== charId) : [...current, charId];
            return { ...sc, activeCharIds: nextIds };
          })
        }));
      };

      // ============================================================================
      // 6. CHARACTER CRUD & CHARACTER SHEET GENERATOR
      // ============================================================================
      const updateCharacter = (id, key, value) => {
        setState((prev) => ({
          ...prev,
          characters: prev.characters.map((ch) => (ch.id === id ? { ...ch, [key]: value } : ch))
        }));
      };

      const addCharacter = () => {
        const nextNum = state.characters.length + 1;
        const newId = `char-${Date.now()}`;
        setState((prev) => ({
          ...prev,
          characters: [
            ...prev.characters,
            {
              id: newId,
              name: `ตัวละคร ${String(nextNum).padStart(2, "0")}`,
              physicalDNA: "Specify age, ethnicity, skin texture, hair style, facial structure, height/build",
              clothingDNA: "Specify exact top, bottom, footwear, accessories, and fabric condition",
              sheetTemplate: "turnaround_4view",
              identityPhrase: `CHAR_${String(nextNum).padStart(2, "0")} (consistent facial structure and exact outfit)`
            }
          ]
        }));
      };

      const removeCharacter = (id) => {
        if (state.characters.length <= 1) return;
        setState((prev) => ({
          ...prev,
          characters: prev.characters.filter((ch) => ch.id !== id),
          scenes: prev.scenes.map((sc) => ({
            ...sc,
            activeCharIds: (sc.activeCharIds || []).filter((cid) => cid !== id)
          }))
        }));
      };

      const buildCharacterSheetPrompt = (ch, idx) => {
        const slot = `CHAR_${String(idx + 1).padStart(2, "0")}`;
        const tpl = ch.sheetTemplate || "turnaround_4view";
        let layoutSpec = "Split-screen character reference turnaround sheet: (Left) Full-body front view, (Center-Left) Full-body 3/4 view, (Center-Right) Full-body side profile, (Right) High-detail close-up portrait of face.";
        if (tpl === "expression_grid") {
          layoutSpec = "4-panel character facial expression & lighting reference sheet: Neutral determined, Fearful/Startled, Melancholic/Tearful, and Side-lit Chiaroscuro profile. Exact same facial bone structure across all panels.";
        } else if (tpl === "costume_prop") {
          layoutSpec = "Detailed costume & prop production reference sheet: Full-body standing pose in A-pose, plus close-up callouts of fabric weave, footwear, bag, and key accessories.";
        }

        return [
          `[CHARACTER REFERENCE SHEET — ${slot}: ${ch.name}]`,
          `LAYOUT: ${layoutSpec}`,
          `SUBJECT PHYSICAL DNA: ${ch.physicalDNA || "-"}`,
          `WARDROBE & PROPS DNA: ${ch.clothingDNA || "-"}`,
          `LIGHTING & STUDIO SETUP: Neutral 5500K studio softbox lighting for clear texture fidelity, clean dark grey matte background (#18181b), no harsh shadows obscuring facial features.`,
          `RENDER QUALITY: ${state.visualLock.style}, 8K photorealistic character design sheet, sharp focus, zero facial distortion, aspect ratio 16:9`
        ].join("\n");
      };

      // ============================================================================
      // 7. VEO 3.1 SCENE PROMPT & STRUCTURED JSON COMPILER
      // ============================================================================
      const buildSingleScenePrompt = (scene, idx) => {
        const activeChars = state.characters.filter((ch) => (scene.activeCharIds || []).includes(ch.id));
        const charDescriptions = activeChars.length > 0
          ? activeChars.map((ch) => `${ch.identityPhrase} [Physical: ${ch.physicalDNA} | Outfit: ${ch.clothingDNA}]`).join(" ; ")
          : "No human characters in frame (environment / object focus only)";

        return [
          `[SCENE ${String(idx + 1).padStart(2, "0")} | ${formatTimecode(scene.start)}-${formatTimecode(scene.end)} (${state.sceneDuration}s) | ${scene.title}]`,
          `CHARACTER LOCK: ${charDescriptions}`,
          `STORY & ACTION STAGING: ${scene.prompt}`,
          `VEO 3.1 CAMERA: ${scene.shotSize || "Medium Shot (MS)"} | Movement: ${scene.movement || "Slow Dolly Push-In"} | Lens: ${scene.lens || "35mm Prime Cinema f/2.0"}`,
          `VEO 3.1 LIGHTING & COLOR: ${scene.lighting || "Low-Key Chiaroscuro"} | Palette: ${state.visualLock.colorPalette} | Atmosphere: ${state.visualLock.atmosphere}`,
          `AUDIO / VO: ${scene.voiceover ? `VO (${state.audioLock.language}): "${scene.voiceover}"` : "Ambient Only"} | SFX: ${scene.sfx || state.audioLock.ambientSfx}`,
          `ASPECT RATIO: ${state.aspectRatio} | NEGATIVE: ${state.visualLock.negativePrompt}`
        ].join("\n");
      };

      const compiledOutput = useMemo(() => {
        if (state.outputMode === "CHAR_SHEETS") {
          return [
            `================================================================================`,
            `PRE-PRODUCTION CHARACTER REFERENCE SHEETS (GENERATE IMAGES BEFORE VIDEO)`,
            `================================================================================`,
            state.characters.map((ch, idx) => buildCharacterSheetPrompt(ch, idx)).join("\n\n--------------------------------------------------------------------------------\n\n"),
            `================================================================================`
          ].join("\n");
        }

        if (state.outputMode === "VEO_JSON") {
          const veoJsonPayload = {
            schema_version: "4.1-veo-3.1-production",
            engine_target: "Google Veo 3.1 / Multi-Node Cinematic Pipeline",
            project_metadata: {
              topic_premise: state.topic,
              master_genre_style: state.masterStyle,
              aspect_ratio: state.aspectRatio,
              total_duration_sec: state.totalDuration,
              shot_duration_sec: state.sceneDuration,
              total_shots: state.scenes.length
            },
            character_consistency_registry: state.characters.map((ch, idx) => ({
              character_id: ch.id,
              slot_tag: `CHAR_${String(idx + 1).padStart(2, "0")}`,
              display_name: ch.name,
              identity_lock_token: ch.identityPhrase,
              physical_attributes_dna: ch.physicalDNA,
              wardrobe_dna: ch.clothingDNA,
              character_sheet_generation_prompt: buildCharacterSheetPrompt(ch, idx)
            })),
            global_cinematography_locks: {
              sensor_and_style_dna: state.visualLock.style,
              base_camera_rig: state.visualLock.camera,
              environmental_atmosphere: state.visualLock.atmosphere,
              color_science_lut: state.visualLock.colorPalette,
              pre_flight_negative_constraints: state.visualLock.negativePrompt
            },
            global_audio_locks: {
              voiceover_profile: state.audioLock.voiceoverTone,
              language: state.audioLock.language,
              master_bgm_score: state.audioLock.bgm,
              base_ambient_sfx: state.audioLock.ambientSfx
            },
            shot_execution_queue: state.scenes.map((sc, idx) => {
              const activeChars = state.characters.filter((c) => (sc.activeCharIds || []).includes(c.id));
              return {
                shot_index: idx + 1,
                shot_id: sc.id,
                narrative_beat: sc.title,
                timing_metrics: {
                  start_sec: sc.start,
                  end_sec: sc.end,
                  duration_sec: state.sceneDuration,
                  timecode: `${formatTimecode(sc.start)}-${formatTimecode(sc.end)}`
                },
                character_consistency_lock: {
                  active_subject_count: activeChars.length,
                  subject_ids: activeChars.map((c) => c.id),
                  subject_dna_injection: activeChars.map((c) => ({
                    name: c.name,
                    identity_token: c.identityPhrase,
                    physical_dna: c.physicalDNA,
                    wardrobe_dna: c.clothingDNA
                  }))
                },
                veo_3_1_camera_metrics: {
                  shot_size: sc.shotSize || "Medium Shot (MS)",
                  camera_movement: sc.movement || "Slow Dolly Push-In",
                  lens_and_aperture: sc.lens || "35mm Prime Cinema f/2.0",
                  aspect_ratio: state.aspectRatio
                },
                veo_3_1_lighting_and_color: {
                  lighting_setup_and_transition: sc.lighting || "Low-Key Chiaroscuro (High Contrast 8:1)",
                  color_science: state.visualLock.colorPalette,
                  atmospheric_volumetrics: state.visualLock.atmosphere
                },
                staging_and_motion_action: sc.prompt,
                audio_design_sync: {
                  voiceover_dialogue: sc.voiceover || "",
                  voiceover_tone: state.audioLock.voiceoverTone,
                  foley_and_sfx: sc.sfx || state.audioLock.ambientSfx,
                  bgm_cue: state.audioLock.bgm
                },
                compiled_veo_3_1_prompt: buildSingleScenePrompt(sc, idx)
              };
            })
          };
          return JSON.stringify(veoJsonPayload, null, 2);
        }

        // TEXT MODE
        const charBlock = state.characters.map((ch, idx) => [
          `[CHARACTER ${String(idx + 1).padStart(2, "0")}: ${ch.name}]`,
          `- Identity Lock Token: ${ch.identityPhrase}`,
          `- Physical DNA: ${ch.physicalDNA || "-"}`,
          `- Wardrobe DNA: ${ch.clothingDNA || "-"}`,
          `- Character Sheet Prompt:\n${buildCharacterSheetPrompt(ch, idx)}`
        ].join("\n")).join("\n\n");

        const scenesBlock = state.scenes.map((sc, idx) => buildSingleScenePrompt(sc, idx)).join("\n\n--------------------------------------------------------------------------------\n\n");

        return [
          `================================================================================`,
          `AI LONG VIDEO DIRECTOR v4.1 — VEO 3.1 MASTER PRODUCTION SCRIPT`,
          `================================================================================`,
          `TOPIC: ${state.topic}`,
          `DURATION: ${state.totalDuration}s (${state.scenes.length} Shots x ${state.sceneDuration}s) | ASPECT RATIO: ${state.aspectRatio}`,
          `MASTER GENRE / STYLE: ${state.masterStyle}`,
          ``,
          `--------------------------------------------------------------------------------`,
          `[01] GLOBAL CHARACTER REGISTRY & REFERENCE SHEET PROMPTS`,
          `--------------------------------------------------------------------------------`,
          charBlock,
          ``,
          `--------------------------------------------------------------------------------`,
          `[02] GLOBAL VISUAL & AUDIO DNA`,
          `--------------------------------------------------------------------------------`,
          `Style DNA: ${state.visualLock.style}`,
          `Camera DNA: ${state.visualLock.camera}`,
          `Atmosphere: ${state.visualLock.atmosphere}`,
          `Color Science: ${state.visualLock.colorPalette}`,
          `Negative Constraints: ${state.visualLock.negativePrompt}`,
          `Voiceover Tone (${state.audioLock.language}): ${state.audioLock.voiceoverTone}`,
          `Master BGM: ${state.audioLock.bgm}`,
          `Ambient SFX: ${state.audioLock.ambientSfx}`,
          ``,
          `--------------------------------------------------------------------------------`,
          `[03] VEO 3.1 SHOT-BY-SHOT EXECUTION SCRIPT (${state.scenes.length} SHOTS)`,
          `--------------------------------------------------------------------------------`,
          scenesBlock,
          `================================================================================`
        ].join("\n");
      }, [state]);

      // ============================================================================
      // 8. CLIPBOARD & FILE ACTIONS
      // ============================================================================
      const copyText = async (text, onSuccess) => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
          }
          onSuccess();
        } catch (err) {
          alert("ไม่สามารถคัดลอกได้ กรุณาคัดลอกจากกล่องข้อความโดยตรง");
        }
      };

      const handleCopyGlobal = () => {
        copyText(compiledOutput, () => {
          setCopiedGlobal(true);
          setTimeout(() => setCopiedGlobal(false), 2000);
        });
      };

      const handleCopySingleScene = (e, scene, idx) => {
        e.stopPropagation();
        const promptText = buildSingleScenePrompt(scene, idx);
        copyText(promptText, () => {
          setCopiedSceneId(scene.id);
          setTimeout(() => setCopiedSceneId(null), 1800);
        });
      };

      const handleCopyCharSheet = (ch, idx) => {
        const promptText = buildCharacterSheetPrompt(ch, idx);
        copyText(promptText, () => {
          setCopiedCharId(ch.id);
          setTimeout(() => setCopiedCharId(null), 1800);
        });
      };

      const handleDownloadOutput = () => {
        const isJson = state.outputMode === "VEO_JSON";
        const ext = isJson ? "json" : "txt";
        const mime = isJson ? "application/json;charset=utf-8" : "text/plain;charset=utf-8";
        const blob = new Blob([compiledOutput], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `veo31-director-${state.outputMode.toLowerCase()}-${state.totalDuration}s.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleExportProjectJson = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `veo31-project-backup-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleImportProjectJson = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed && Array.isArray(parsed.scenes) && Array.isArray(parsed.characters)) {
              setState(parsed);
              setExpandedSceneIds(parsed.scenes.map((s) => s.id));
            } else {
              alert("ไฟล์ JSON ไม่ถูกต้องตามโครงสร้างโปรเจกต์");
            }
          } catch (err) {
            alert("ไม่สามารถอ่านไฟล์ JSON ได้");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      const handleResetDefault = () => {
        if (confirm("ต้องการรีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้นใช่หรือไม่?")) {
          const fresh = createInitialState();
          setState(fresh);
          setExpandedSceneIds(fresh.scenes.map((s) => s.id));
          localStorage.removeItem(STORAGE_KEY);
        }
      };

      // ============================================================================
      // 9. RENDER UI

                          h("span", { style: { fontSize: 10.5, color: "var(--text-muted)" } }, "พิมพ์แก้ไขข้อความด้านล่างได้ทันที")
                        ]),

                        h("div", { key: "st" }, [
                          h("label", { className: "label-title" }, "SHOT TITLE / NARRATIVE BEAT (ชื่อช็อต / จังหวะการเล่าเรื่อง)"),
                          h("input", {
                            className: "input-field",
                            value: sc.title,
                            onChange: (e) => updateScene(sc.id, "title", e.target.value),
                            placeholder: "เช่น HOOK - เปิดฉากดึงดูดสายตา..."
                          })
                        ]),

                        h("div", { key: "sc-prompt" }, [
                          h("label", { className: "label-title", style: { color: "#34d399" } },
                            "STORY & VISUAL ACTION (เนื้อเรื่อง การกระทำของตัวละคร และสิ่งที่เกิดขึ้นในช็อตนี้)"
                          ),
                          h("textarea", {
                            className: "textarea-field",
                            rows: 3,
                            value: sc.prompt,
                            onChange: (e) => updateScene(sc.id, "prompt", e.target.value),
                            placeholder: "บรรยายเนื้อเรื่องและเหตุการณ์ที่เกิดขึ้นในช็อตนี้..."
                          })
                        ]),

                        h("div", { key: "row-vo-sfx", className: "grid-2" }, [
                          h("div", { key: "vo" }, [
                            h("label", { className: "label-title" }, "VOICEOVER / DIALOGUE (บทพูดหรือเสียงบรรยายเนื้อเรื่องในช็อตนี้)"),
                            h("input", {
                              className: "input-field",
                              placeholder: "บทพูดหรือเสียงบรรยาย...",
                              value: sc.voiceover || "",
                              onChange: (e) => updateScene(sc.id, "voiceover", e.target.value)
                            })
                          ]),
                          h("div", { key: "sfx" }, [
                            h("label", { className: "label-title" }, "SHOT FOLEY & SFX (เสียงประกอบในช็อตนี้)"),
                            h("input", {
                              className: "input-field",
                              placeholder: "เช่น เสียงประตูปิด, เสียงฝีเท้า...",
                              value: sc.sfx || "",
                              onChange: (e) => updateScene(sc.id, "sfx", e.target.value)
                            })
                          ])
                        ])
                      ]),

                      // Active Character Selector per Scene
                      h("div", { key: "char-select" }, [
                        h("label", { className: "label-title", style: { color: "var(--accent-2)" } },
                          "ACTIVE CHARACTERS IN SHOT (คลิกเลือกตัวละครที่อยู่ในฉากนี้)"
                        ),
                        h("div", { className: "flex-row-wrap" },
                          state.characters.map((ch, cIdx) => {
                            const isChecked = (sc.activeCharIds || []).includes(ch.id);
                            return h("button", {
                              key: ch.id,
                              type: "button",
                              className: `chip-toggle ${isChecked ? "active" : ""}`,
                              onClick: () => toggleSceneCharacter(sc.id, ch.id)
                            }, `${isChecked ? "✓" : "+"} CHAR 0${cIdx + 1}: ${ch.name.split(" - ")[0]}`);
                          })
                        )
                      ]),

                      // Veo 3.1 Camera & Lighting Metrics (Hidden in Quick Story Mode for cleaner writing)
                      !quickStoryMode && h("div", { key: "veo-spec", className: "veo-box" }, [
                        h("div", { key: "vh", className: "flex-between" }, [
                          h("span", { className: "mono", style: { fontSize: 10.5, fontWeight: 600, color: "var(--accent-2)" } }, "🎥 VEO 3.1 CAMERA & LIGHTING PARAMETERS"),
                          h("span", { className: "badge badge-amber mono" }, "VEO 3.1 ENGINE READY")
                        ]),
                        h("div", { key: "vg1", className: "grid-2" }, [
                          h("div", { key: "sz" }, [
                            h("label", { className: "label-title" }, "SHOT SIZE (ขนาดภาพ)"),
                            h("select", {
                              className: "select-field",
                              value: sc.shotSize || VEO_SHOT_SIZES[3],
                              onChange: (e) => updateScene(sc.id, "shotSize", e.target.value)
                            }, VEO_SHOT_SIZES.map((s) => h("option", { key: s, value: s }, s)))
                          ]),
                          h("div", { key: "mv" }, [
                            h("label", { className: "label-title" }, "CAMERA MOVEMENT (การเคลื่อนกล้อง)"),
                            h("select", {
                              className: "select-field",
                              value: sc.movement || VEO_CAMERA_MOVEMENTS[1],
                              onChange: (e) => updateScene(sc.id, "movement", e.target.value)
                            }, VEO_CAMERA_MOVEMENTS.map((m) => h("option", { key: m, value: m }, m)))
                          ])
                        ]),
                        h("div", { key: "vg2", className: "grid-2" }, [
                          h("div", { key: "ln" }, [
                            h("label", { className: "label-title" }, "LENS & DEPTH OF FIELD (ระยะเลนส์)"),
                            h("select", {
                              className: "select-field",
                              value: sc.lens || VEO_LENS_SPECS[1],
                              onChange: (e) => updateScene(sc.id, "lens", e.target.value)
                            }, VEO_LENS_SPECS.map((l) => h("option", { key: l, value: l }, l)))
                          ]),
                          h("div", { key: "lt" }, [
                            h("label", { className: "label-title" }, "LIGHTING TRANSITION & KELVIN (การจัดแสง)"),
                            h("select", {
                              className: "select-field",
                              value: sc.lighting || VEO_LIGHTING_MODES[0],
                              onChange: (e) => updateScene(sc.id, "lighting", e.target.value)
                            }, VEO_LIGHTING_MODES.map((lt) => h("option", { key: lt, value: lt }, lt)))
                          ])
                        ])
                      ])
                    ])
                  ]);
                })
              )
            ]),

            // SECTION 05: MASTER OUTPUT COMPILER (VEO 3.1 JSON / TEXT / CHAR SHEETS)
            h("section", { key: "sec-05", className: "card-accent", style: { background: "#0b0b0e" } }, [
              h("div", { key: "hd", className: "card-header" }, [
                h("div", { key: "l", className: "flex-row-wrap" }, [
                  h("span", { key: "n", className: "badge-step", style: { background: "var(--accent)", color: "#fff" } }, "05"),
                  h("div", { key: "t" }, [
                    h("h2", { style: { fontSize: 13, fontWeight: 600, letterSpacing: "0.06em", margin: 0 } }, "MASTER PRODUCTION COMPILER"),
                    h("span", { className: "mono", style: { fontSize: 10.5, color: "var(--text-muted)" } },
                      `${compiledOutput.length.toLocaleString()} chars • อัปเดตตามเนื้อเรื่องที่แก้ไขแบบ Real-time`
                    )
                  ])
                ]),

                h("div", { key: "r", className: "flex-row-wrap" }, [
                  h("button", {
                    key: "mode-veo",
                    type: "button",
                    className: `chip-toggle mono ${state.outputMode === "VEO_JSON" ? "active" : ""}`,
                    onClick: () => updateField("outputMode", "VEO_JSON")
                  }, "{ } VEO 3.1 JSON"),
                  h("button", {
                    key: "mode-sheets",
                    type: "button",
                    className: `chip-toggle mono ${state.outputMode === "CHAR_SHEETS" ? "active" : ""}`,
                    onClick: () => updateField("outputMode", "CHAR_SHEETS")
                  }, "🖼️ CHAR SHEETS"),
                  h("button", {
                    key: "mode-txt",
                    type: "button",
                    className: `chip-toggle mono ${state.outputMode === "TEXT" ? "active" : ""}`,
                    onClick: () => updateField("outputMode", "TEXT")
                  }, "📄 TEXT SCRIPT"),
                  h("button", {
                    key: "btn-copy",
                    type: "button",
                    className: "btn btn-primary",
                    onClick: handleCopyGlobal
                  }, copiedGlobal ? "✓ คัดลอกแล้ว" : "⎙ COPY OUTPUT"),
                  h("button", {
                    key: "btn-dl",
                    type: "button",
                    className: "btn btn-secondary mono",
                    onClick: handleDownloadOutput
                  }, `⇩ .${state.outputMode === "VEO_JSON" ? "JSON" : "TXT"}`)
                ])
              ]),

              h("div", { key: "bd", style: { padding: "1rem" } }, [
                h("textarea", {
                  readOnly: true,
                  value: compiledOutput,
                  spellCheck: false,
                  className: "textarea-field mono",
                  style: {
                    height: 490,
                    background: "#070709",
                    fontSize: 11.5,
                    lineHeight: 1.65,
                    color: "#d6d6d8",
                    border: "1px solid var(--border)"
                  }
                })
              ])
            ])
          ])
        ])
      ]);
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(h(App));
  </script>
</body>
</html>
