<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#dcdad4;--acc:#b45309;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#161616;--ink:#f5f5f5;--mute:#9a9a9a;--line:#2e2e2e;--acc:#f59e0b;--accfg:#111}}
:root[data-theme="dark"]{--bg:#0a0a0a;--card:#161616;--ink:#f5f5f5;--mute:#9a9a9a;--line:#2e2e2e;--acc:#f59e0b;--accfg:#111}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}button.on{border-color:var(--acc);color:var(--acc)}
.shot{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}.shot>.hd{display:flex;gap:8px;align-items:center;padding:8px;flex-wrap:wrap}.shot>.bd{padding:8px;border-top:1px solid var(--line)}
.tc{font-family:'JetBrains Mono',monospace;color:var(--mute);font-size:12px}
.out{font-family:'JetBrains Mono',monospace;font-size:12px;min-height:280px}
.chip{display:inline-flex;gap:4px;align-items:center;font-size:12px}.chip input{width:auto}
</style>
</head>

  'Cinematic Thriller & Mystery': D('Cinematic thriller, tense and grounded, photorealistic', 'Slow push-ins, over-the-shoulder, handheld at peaks', 'Dim interiors, rain on glass, shadowy corridors', 'Cool steel blue, sickly green, muted skin', 'cartoon, cheerful bright colors, extra characters'),
  'Drama Realistic & Emotional': D('Realistic emotional drama, natural performances, intimate', 'Handheld close coverage, 50mm natural framing', 'Everyday homes and streets, soft window light', 'Natural palette, warm skin tones, gentle contrast', 'stylized effects, cartoon, over-saturation'),

  'แอ็กชัน / เต้น / ไซไฟ': ['Cybernetic Street & B-Boy Breaking Action', 'Cyberpunk Neo-Bangkok Sci-Fi', 'Martial Arts & Wuxia Mythic Action', 'High-Speed Sports & Choreography'],

const OPT = {

  camera_movement: ['Static Locked-Off','Slow Dolly Push-In','Handheld Organic Micro-Shake','180-Degree Orbit Arc','Crane Rise','Whip Pan'],

};

/* ---------- Helpers ---------- */
const mmss = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 9);
const newChar = (n) => ({id: uid(), name: 'ตัวละคร ' + n, physicalDNA: '', clothingDNA: '', identityPhrase: '', sheet: Object.keys(SHEETS)[0]});

function makeShot(i, chars) {
  return {id: uid(), title: SEED.titles[i] || 'SHOT ' + (i + 1), prompt: SEED.prompts[i] || '', chars: chars.map(c => c.id),
    camera: '', voiceover: '', sfx: '', shot_size: OPT.shot_size[2], camera_movement: OPT.camera_movement[1],
    lens_and_aperture: OPT.lens_and_aperture[3], lighting_setup_and_transition: OPT.lighting_setup_and_transition[1]};
}

/* empty shot for manual add or when raising the shot count (never reuses the seed story) */
function blankShot(n, chars) {
  return {...makeShot(999, chars), title: 'SHOT ' + (n + 1), prompt: ''};
}

function initialProject() {
  const chars = [
    {id: 'c1', name: 'ดาว', physicalDNA: 'ผู้หญิงไทยอายุ 22, ผมยาวดำตรงถึงกลางหลัง, ดวงตากลมโตสีดำ, สูง 162cm, ผอมบาง, ใบหน้าเศร้าแต่มีความมุ่งมั่น', clothingDNA: 'เสื้อยืดสีขาวครีมแขนยาว, กางเกงยีนส์ซีด, รองเท้าผ้าใบขาวเปื้อนโคลน, กระเป๋าผ้าสีน้ำตาล', identityPhrase: '', sheet: Object.keys(SHEETS)[0]},

    ar: '16:9', styleName: 'Documentary Horror', dur: 8, g: {...STYLES['Documentary Horror']},

/* ---------- Prompt builders ---------- */
const castOf = (p, shot) => p.chars.filter(c => shot.chars.includes(c.id));

function charDNA(c) {
  return c.name + ': ' + (c.physicalDNA || '-') + '; wearing ' + (c.clothingDNA || '-') + (c.identityPhrase ? ' (' + c.identityPhrase + ')' : '');
}

function scenePrompt(p, shot, i) {
  const t0 = i * p.dur, cast = castOf(p, shot);
  return [
    '[SHOT ' + String(i + 1).padStart(2, '0') + ' | ' + mmss(t0) + '-' + mmss(t0 + p.dur) + ' | ' + shot.title + ']',
    'CHARACTERS IN FRAME (only these, no others): ' + (cast.length ? '' : 'none'),
    ...cast.map(charDNA),
    'STYLE: ' + p.g.style + '. ATMOSPHERE: ' + p.g.atmosphere + '. PALETTE: ' + p.g.colorPalette,
    'CAMERA: ' + [shot.shot_size, shot.camera_movement, shot.lens_and_aperture, shot.camera].filter(Boolean).join(' | '),
    'LIGHTING: ' + shot.lighting_setup_and_transition,
    'ACTION: ' + shot.prompt,
    shot.voiceover ? 'VOICEOVER: ' + shot.voiceover : '',
    'SFX: ' + (shot.sfx || p.audio.sfx) + ' | BGM: ' + p.audio.bgm,
    'ASPECT RATIO: ' + p.ar + ' | DURATION: ' + p.dur + 's',
    'AVOID: ' + p.g.negativePrompt
  ].filter(Boolean).join('\n');
}

/* Offer a file through the viewer's downloads capability (script-started saves are inert on published pages) */
async function saveFile(filename, text, notify, manual) {
  let why = '';
  try {
    const dl = window.claude && await window.claude.use('downloads');
    if (dl) { await dl.save({filename, data: text}); notify('บันทึกไฟล์แล้ว'); return; }
    why = 'ไม่มีระบบดาวน์โหลดในมุมมองนี้';
  } catch (e) {
    if (e && e.code === 'declined') { notify('ยกเลิกการบันทึก'); return; }
    why = 'บันทึกไม่สำเร็จ (' + ((e && (e.code || e.message)) || 'unknown') + ')';
  }
  /* fallback 1: plain download (works only where the page is not sandboxed) */
  try {
    const url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {}
  /* fallback 2: show the JSON in a box the person can select, copy and save by hand */
  notify(why);
  manual({name: filename, text, why});
  setTimeout(() => { const el = document.getElementById('manual-box'); if (el) el.scrollIntoView({block: 'center'}); }, 150);
}

/* Export in the same schema as an 'AI Drama Studio - Workflow Editor' project backup */
const pad3 = (n) => String(n).padStart(3, '0');
function workflowBackup(p) {
  const ids = {}, character_db = {};
  p.chars.forEach((c, i) => {
    const key = 'CHAR_' + pad3(i + 1);
    ids[c.id] = key;
    character_db[key] = {character_number: i + 1, character_name: c.name, face_id: 'FACE_' + pad3(i + 1), voice_id: 'VOICE_' + pad3(i + 1),
      status: 'LOCKED', model_sheet_url: '', costume_id: 'COSTUME_001',
      master_prompt_ref: key + '_MASTER_V1 | ' + c.name + ': ' + c.physicalDNA + ' | wearing ' + c.clothingDNA};
  });
  const n = p.shots.length;
  const build = (s, i) => {
    const cast = castOf(p, s), names = cast.map(c => c.name).join(', ');
    const lock = cast.map(c => c.name + ': ' + c.physicalDNA + ' | wearing ' + c.clothingDNA).join(' / ');
    const cine = {subject: names, action: s.prompt, environment: p.g.atmosphere, camera: s.shot_size + ', ' + s.lens_and_aperture,
      lighting: s.lighting_setup_and_transition, moodColor: p.g.style + ', ' + p.g.colorPalette, aspectRatio: p.ar};
    const sheet = {modelSheetStatus: 'NONE', modelSheetMissing: names, modelSheetReady: 0, modelSheetTotal: cast.length, lockStatus: 'UNLOCKED'};
    const inputText = 'ฉาก ' + (i + 1) + '/' + n + ' — ' + p.styleName + '\nเหตุการณ์หลัก: ' + s.prompt + '\n[ล็อกตัวละคร] ' + lock;
    const inputData = {label: 'Input Node\nรับข้อมูลเริ่มต้น', shotNumber: i + 1, inputText, actors: cast.map(c => ids[c.id]),
      speakerId: 'NONE', speakerVoiceId: '', dialogueText: s.voiceover, dialogueTiming: '', masterFrameImage: '',
      motionDirection: [s.camera_movement, s.camera].filter(Boolean).join(', '), cinematicDetails: cine, ...sheet};
    const masterPrompt = inputText + '\n' + [names, s.prompt, p.g.atmosphere, cine.camera, cine.lighting, cine.moodColor].join(', ')
      + '\n' + p.ar + ', ' + p.dur + 's\nConstraints: No subtitles, no text on screen. Same characters and outfits throughout. Only the listed characters appear. Avoid: ' + p.g.negativePrompt;
    const shortPrompt = '[PREVIEW SHOT] ' + names + ' | Action: ' + s.prompt + ' | Location: ' + p.g.atmosphere + ' | Style: ' + cine.moodColor + ' (' + p.ar + ')';
    return {inputData, sheet, masterPrompt, shortPrompt};
  };
  const shots_queue = p.shots.map((s, i) => ({shot_number: i + 1, status: 'PASS',
    description: 'Subject: ' + castOf(p, s).map(c => c.name).join(', ') + ' | Env: ' + p.g.atmosphere, inputData: build(s, i).inputData}));
  const first = build(p.shots[0], 0);
  const box = (bg, color, border, width) => ({background: bg, color, border, borderRadius: 10, padding: 14, width, whiteSpace: 'pre-line'});
  const nodes_state = [
    {id: 'input-1', type: 'custom', position: {x: 50, y: 120}, data: first.inputData, style: box('#172b48', '#e5edff', '1px solid #4386e8', 165), measured: {width: 165, height: 242}},
    {id: 'validator-1', type: 'custom', position: {x: 280, y: 120}, data: {label: 'Validation Gate Node\nด่านตรวจกฎของ Director', validationStatus: 'PENDING', lastError: null, autoFixable: false, targetCharId: null, ...first.sheet}, style: box('#3f2c00', '#ffedd5', '2px solid #eab308', 175), measured: {width: 175, height: 155}},
    {id: 'prompt-1', type: 'custom', position: {x: 530, y: 120}, data: {label: 'AI Prompt Node\nสร้างคำสั่ง AI', promptText: '', ...first.sheet}, style: box('#291e4b', '#f0e7ff', '1px solid #9b78ef', 165), measured: {width: 165, height: 154}},
    {id: 'video-1', type: 'video', position: {x: 760, y: 120}, data: {label: 'Output Node\nส่งออกไปยัง Google Veo 3', masterPrompt: first.masterPrompt, shortPrompt: first.shortPrompt, promptWarning: ''}, measured: {width: 280, height: 432}}
  ];
  const edges_state = [['e1', 'input-1', 'validator-1'], ['e2', 'validator-1', 'prompt-1'], ['e3', 'prompt-1', 'video-1']].map(([id, source, target]) => ({id, source, target, animated: true}));
  return JSON.stringify({project_name: p.name || 'Veo Project', workflow_id: String(Date.now()), timestamp: new Date().toISOString(),
    workflow_type: 'AI Drama Studio — Workflow Editor v1.2.0', character_db, shots_queue, nodes_state, edges_state}, null, 2);
}

function jsonPipeline(p) {
  return JSON.stringify({
    model: 'veo-3.1', aspect_ratio: p.ar, shot_duration_seconds: p.dur, total_seconds: p.dur * p.shots.length,
    visual_style: p.g, audio: p.audio,
    shots: p.shots.map((s, i) => ({
      index: i + 1, timecode: mmss(i * p.dur) + '-' + mmss((i + 1) * p.dur), title: s.title,
      characters: castOf(p, s).map(c => ({name: c.name, physical_dna: c.physicalDNA, clothing_dna: c.clothingDNA})),
      action: s.prompt, shot_size: s.shot_size, camera_movement: s.camera_movement,
      lens_and_aperture: s.lens_and_aperture, lighting_setup_and_transition: s.lighting_setup_and_transition,
      camera_notes: s.camera, voiceover: s.voiceover, sfx: s.sfx
    }))
  }, null, 2);
}

const sheetPrompt = (p, c) => SHEETS[c.sheet] + '. Subject: ' + charDNA(c) + '. Style: ' + p.g.style + '. Avoid: ' + p.g.negativePrompt;

function masterPrompt(p) {
  return ['VEO 3.1 LONG VIDEO DIRECTOR | ' + p.shots.length + ' shots x ' + p.dur + 's = ' + p.dur * p.shots.length + 's | ' + p.ar,
    'STORY: ' + p.topic, '', ...p.shots.map((s, i) => scenePrompt(p, s, i) + '\n')].join('\n');
}

function Field(props) {

function Pick(props) {
  return h('label', {className: 'f'}, h('span', null, props.label),

function StylePick(props) {

function useCopy() {
  const [msg, setMsg] = useState('');
  const copy = async (text, tag) => {
    try { await navigator.clipboard.writeText(text); setMsg('คัดลอกแล้ว ' + (tag || '')); }
    catch (e) { setMsg('คัดลอกไม่สำเร็จ — เลือกข้อความแล้วคัดลอกเอง'); }
    setTimeout(() => setMsg(''), 2000);
  };
  const say = (m) => { setMsg(m); setTimeout(() => setMsg(''), 2500); };
  return [msg, copy, say];
}

/* ---------- App ---------- */
function App() {
  const [p, setP] = useState(loadProject);
  const [open, setOpen] = useState({});
  const [mode, setMode] = useState('prompt');
  const [armed, setArmed] = useState(false);
  const [quick, setQuick] = useState(false);
  const [presetSel, setPresetSel] = useState('');
  const [showSplit, setShowSplit] = useState(false);
  const [script, setScript] = useState('');
  const [ask, setAsk] = useState('');
  const [countDraft, setCountDraft] = useState('');
  const [msg, copy, say] = useCopy();
  const [manual, setManual] = useState(null);
  const outRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch (e) {} }, [p]);

  const patch = (o) => setP(prev => ({...prev, ...o}));
  const setG = (k, v) => setP(prev => ({...prev, g: {...prev.g, [k]: v}}));
  const setAudio = (k, v) => setP(prev => ({...prev, audio: {...prev.audio, [k]: v}}));
  const upShot = (id, o) => setP(prev => ({...prev, shots: prev.shots.map(s => s.id === id ? {...s, ...o} : s)}));
  const upChar = (id, o) => setP(prev => ({...prev, chars: prev.chars.map(c => c.id === id ? {...c, ...o} : c)}));
  const toggle = (id) => setOpen(o => ({...o, [id]: !o[id]}));
  const move = (i, d) => setP(prev => {
    const a = [...prev.shots], j = i + d; if (j < 0 || j >= a.length) return prev;
    [a[i], a[j]] = [a[j], a[i]]; return {...prev, shots: a};
  });
  const dup = (i) => setP(prev => {
    const a = [...prev.shots]; a.splice(i + 1, 0, {...a[i], id: uid(), title: a[i].title + ' (copy)'}); return {...prev, shots: a};
  });
  const remove = (id) => setP(prev => prev.shots.length > 1 ? {...prev, shots: prev.shots.filter(s => s.id !== id)} : prev);
  const addShot = () => setP(prev => ({...prev, shots: [...prev.shots, blankShot(prev.shots.length, prev.chars)]}));
  /* set the exact number of shots: extra blank shots are appended, or shots are trimmed from the end */
  const setCount = (n) => setP(prev => {
    const cur = prev.shots.length;
    if (n <= cur) return {...prev, shots: prev.shots.slice(0, n)};
    return {...prev, shots: [...prev.shots, ...Array.from({length: n - cur}, (_, k) => blankShot(cur + k, prev.chars))]};
  });
  const addChar = () => setP(prev => {
    const c = newChar(prev.chars.length + 1);
    return {...prev, chars: [...prev.chars, c], shots: prev.shots.map(s => ({...s, chars: [...s.chars, c.id]}))};
  });
  const delChar = (id) => setP(prev => prev.chars.length > 1
    ? {...prev, chars: prev.chars.filter(c => c.id !== id), shots: prev.shots.map(s => ({...s, chars: s.chars.filter(x => x !== id)}))} : prev);
  const pickStyle = (name) => setP(prev => ({...prev, styleName: name, g: {...STYLES[name]}}));

  /* destructive actions need a second click within 3 seconds */
  const twice = (key, fn) => {
    if (ask !== key) { setAsk(key); setTimeout(() => setAsk(a => a === key ? '' : a), 3000); }
    else { fn(); setAsk(''); }
  };
  const applyPreset = () => setP(prev => ({...prev, shots: PRESETS[presetSel].map((line, i) => {
    const k = line.indexOf(' | ');
    return {...makeShot(i, prev.chars), title: line.slice(0, k), prompt: line.slice(k + 3)};
  })}));
  /* Auto-adapt: spread the premise across all shots in order, plus each shot's active cast */
  const adaptTopic = () => setP(prev => {
    const parts = prev.topic.split(/[.!?]+|\s+/).filter(Boolean), n = prev.shots.length;
    if (!parts.length) return prev;
    return {...prev, shots: prev.shots.map((s, i) => {
      const a = Math.floor(i * parts.length / n), b = Math.max(a + 1, Math.floor((i + 1) * parts.length / n));
      const names = castOf(prev, s).map(c => c.name).join(', ') || '-';
      return {...s, prompt: s.title + ': ' + parts.slice(a, b).join(' ') + ' | Cast: ' + names};
    })};
  });
  /* Split a long script by line/paragraph and distribute it over the shots in order */
  const splitScript = () => setP(prev => {
    const units = script.split('\n').map(t => t.trim()).filter(Boolean), n = prev.shots.length;
    if (!units.length) return prev;
    const texts = units.length > n
      ? prev.shots.map((_, i) => units.slice(Math.floor(i * units.length / n), Math.floor((i + 1) * units.length / n)).join(' '))
      : units;
    return {...prev, shots: prev.shots.map((s, i) => i < texts.length ? {...s, prompt: texts[i]} : s)};
  });

  const loadJson = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { setP(JSON.parse(r.result)); } catch (err) { alert('ไฟล์ JSON ไม่ถูกต้อง'); } };
    r.readAsText(f); e.target.value = '';
  };
  const reset = () => {
    if (!armed) { setArmed(true); setTimeout(() => setArmed(false), 3000); return; }
    setP(initialProject()); setArmed(false);
  };

  const output = useMemo(() => {
    if (mode === 'workflow') return workflowBackup(p);
    if (mode === 'json') return jsonPipeline(p);
    if (mode === 'sheets') return p.chars.map(c => '## ' + c.name + '\n' + sheetPrompt(p, c)).join('\n\n');
    return masterPrompt(p);
  }, [p, mode]);

  const total = p.dur * p.shots.length;
  const allOpen = p.shots.every(s => open[s.id]);

  return h('div', {className: 'wrap'},
    h('header', null, h('h1', null, '🎬 Veo 3.1 Video Director'),
      h('div', {className: 'row'},
        h('button', {onClick: () => saveFile('veo-project.json', JSON.stringify(p, null, 2), say, setManual)}, 'Save .json'),
        h('button', {onClick: () => fileRef.current.click()}, 'Load .json'),
        h('button', {onClick: reset}, armed ? 'กดอีกครั้งเพื่อยืนยัน' : 'Reset'),
        h('span', {className: 'tc'}, msg),
        h('input', {ref: fileRef, type: 'file', accept: '.json,application/json', style: {display: 'none'}, onChange: loadJson}))),

    h('section', {className: 'card'}, h('h2', null, '01 · เรื่องและสไตล์'),
      h(Field, {label: 'TOPIC / STORY PREMISE', rows: 3, value: p.topic, onChange: (v) => patch({topic: v})}),
      h('div', {className: 'grid', style: {marginTop: 8}},
        h(StylePick, {value: p.styleName, onChange: pickStyle}),
        h(Pick, {label: 'Aspect Ratio', value: p.ar, options: ['16:9', '9:16', '1:1', '4:5', '2.39:1'], onChange: (v) => patch({ar: v})}),
        h('div', {className: 'f'}, h('span', null, 'ความยาวต่อช็อต'),
          h('div', {className: 'row'}, [5, 8, 10].map(d => h('button', {key: d, className: p.dur === d ? 'on' : '', onClick: () => patch({dur: d})}, d + 's')),
            h('span', {className: 'tc'}, p.shots.length + ' ช็อต = ' + total + ' วินาที'))),
        h('div', {className: 'f'}, h('span', null, 'จำนวนช็อต (1–60)'),
          h('div', {className: 'row'},
            h('input', {type: 'number', min: 1, max: 60, style: {width: 80}, placeholder: String(p.shots.length), value: countDraft, onChange: (e) => setCountDraft(e.target.value)}),
            h('button', {disabled: !countDraft, onClick: () => {
              const n = Math.min(60, Math.max(1, parseInt(countDraft, 10) || 0));
              const apply = () => { setCount(n); setCountDraft(''); };
              if (n < p.shots.length) twice('count', apply); else apply();
            }}, ask === 'count' ? 'กดอีกครั้งเพื่อยืนยัน (ตัดช็อตท้ายออก)' : 'ปรับจำนวน'))))),

    h('section', {className: 'card'}, h('h2', null, '02 · ตัวละคร (Character DNA)'),
      p.chars.map(c => h('div', {key: c.id, className: 'shot'}, h('div', {className: 'bd', style: {borderTop: 0}},
        h('div', {className: 'grid'},
          h(Field, {label: 'ชื่อ', value: c.name, onChange: (v) => upChar(c.id, {name: v})}),
          h(Field, {label: 'Identity phrase (ไม่บังคับ)', value: c.identityPhrase, onChange: (v) => upChar(c.id, {identityPhrase: v})}),
          h(Field, {label: 'Physical DNA', rows: 3, value: c.physicalDNA, onChange: (v) => upChar(c.id, {physicalDNA: v})}),
          h(Field, {label: 'Clothing DNA', rows: 3, value: c.clothingDNA, onChange: (v) => upChar(c.id, {clothingDNA: v})}),
          h(Pick, {label: 'Character Sheet Layout', value: c.sheet, options: Object.keys(SHEETS), onChange: (v) => upChar(c.id, {sheet: v})}),
          h('label', {className: 'f'}, h('span', null, 'Preview Prompt (real-time)'), h('textarea', {readOnly: true, rows: 3, value: sheetPrompt(p, c)}))),
        h('div', {className: 'row', style: {marginTop: 8}},
          h('button', {onClick: () => copy(sheetPrompt(p, c), 'Character Sheet')}, '🖼️ Copy Character Sheet Prompt'),
          h('button', {onClick: () => delChar(c.id)}, 'ลบตัวละคร'))))),
      h('button', {onClick: addChar}, '+ เพิ่มตัวละคร')),

    h('section', {className: 'card'}, h('h2', null, '03 · Visual & Audio Lock'),
      h('div', {className: 'grid'},
        ['style', 'camera', 'atmosphere', 'colorPalette', 'negativePrompt'].map(k => h(Field, {key: k, label: k, rows: 2, value: p.g[k], onChange: (v) => setG(k, v)})),
        ['voiceover', 'bgm', 'sfx'].map(k => h(Field, {key: k, label: 'audio · ' + k, rows: 2, value: p.audio[k], onChange: (v) => setAudio(k, v)})))),

    h('section', {className: 'card'}, h('h2', null, '04 · ช็อต (' + p.shots.length + ')'),
      h('div', {className: 'row', style: {marginBottom: 8}},
        h('select', {style: {width: 'auto', flex: 1}, value: presetSel, onChange: (e) => setPresetSel(e.target.value)},
          h('option', {value: ''}, '— พรีเซ็ตโครงเรื่อง 18 ฉาก —'),
          Object.keys(PRESETS).map(k => h('option', {key: k, value: k}, k))),
        h('button', {disabled: !presetSel, onClick: () => twice('preset', applyPreset)}, ask === 'preset' ? 'กดอีกครั้งเพื่อยืนยัน (แทนที่ช็อตทั้งหมด)' : 'โหลดพรีเซ็ต'),
        h('button', {onClick: () => twice('adapt', adaptTopic)}, ask === 'adapt' ? 'กดอีกครั้งเพื่อยืนยัน (แทนที่เนื้อเรื่อง)' : '⚡ สร้างโครงเรื่องลงทุกช็อตอัตโนมัติ'),
        h('button', {className: showSplit ? 'on' : '', onClick: () => setShowSplit(s => !s)}, '📋 วางสคริปต์ยาว')),
      showSplit && h('div', {style: {marginBottom: 8}},
        h(Field, {label: 'วางสคริปต์เนื้อเรื่อง (แบ่งตามบรรทัด/ย่อหน้า แล้วกระจายลงแต่ละช็อตตามลำดับ)', rows: 6, value: script, onChange: setScript}),
        h('button', {style: {marginTop: 6}, disabled: !script.trim(), onClick: () => twice('split', splitScript)}, ask === 'split' ? 'กดอีกครั้งเพื่อยืนยัน (แทนที่เนื้อเรื่องเดิม)' : 'แบ่งเข้าแต่ละช็อต')),
      h('div', {className: 'row', style: {marginBottom: 8}},
        h('button', {onClick: () => setOpen(Object.fromEntries(p.shots.map(s => [s.id, !allOpen])))}, allOpen ? 'พับทั้งหมด' : 'กางทั้งหมด'),
        h('button', {className: quick ? 'on' : '', onClick: () => setQuick(q => !q)}, quick ? '← กลับไปมุมมองรายช็อต' : '📝 แก้ไขเนื้อเรื่องต่อเนื่องทุกช็อต'),
        h('button', {onClick: addShot}, '+ เพิ่มช็อต')),
      quick
        ? h(QuickEditor, {p, update: upShot})
        : p.shots.map((s, i) => h(Shot, {key: s.id, p, shot: s, i, open: !!open[s.id], update: upShot, toggle, move, remove, dup, copy}))),

    h('section', {className: 'card'}, h('h2', null, '05 · Output'),
      h('div', {className: 'row', style: {marginBottom: 8}},
        [['prompt', 'PROMPT'], ['json', '{ } VEO 3.1 JSON'], ['workflow', '🧩 WORKFLOW STUDIO'], ['sheets', '🖼️ CHAR SHEETS']].map(([k, l]) =>
          h('button', {key: k, className: mode === k ? 'on' : '', onClick: () => setMode(k)}, l)),
        h('button', {className: 'p', onClick: () => copy(output, 'ทั้งหมด')}, 'Copy'),
        h('button', {onClick: () => { outRef.current.focus(); outRef.current.select(); }}, 'เลือกทั้งหมด'),
        (mode === 'json' || mode === 'workflow') && h('button', {onClick: () => saveFile((mode === 'workflow' ? (p.name || 'Veo Project') + '_Backup' : 'veo31-shots') + '.json', output, say, setManual)}, '⬇ ดาวน์โหลด .json'),
        mode === 'workflow' && h('input', {style: {width: 170}, placeholder: 'project_name', value: p.name || '', onChange: (e) => patch({name: e.target.value})}),
        h('span', {className: 'tc'}, msg)),
      manual && h('div', {className: 'shot', style: {padding: 10, marginBottom: 8}},
        h('div', {className: 'f', style: {marginBottom: 6}}, manual.why + ' — คัดลอกข้อความด้านล่าง แล้ววางในแอปโน้ตหรือตัวแก้ไขข้อความ และบันทึกเป็นไฟล์ชื่อ ' + manual.name),
        h('textarea', {id: 'manual-box', className: 'out', readOnly: true, rows: 8, value: manual.text}),
        h('div', {className: 'row', style: {marginTop: 6}},
          h('button', {onClick: () => { const el = document.getElementById('manual-box'); el.focus(); el.select(); }}, 'เลือกทั้งหมด'),
          h('button', {onClick: () => copy(manual.text, 'JSON')}, 'Copy'),
          h('button', {onClick: () => setManual(null)}, 'ปิด'))),
      h('textarea', {ref: outRef, className: 'out', readOnly: true, rows: 16, value: output})));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
